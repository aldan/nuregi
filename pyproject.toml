[tool.poetry]
name = "nuregi"
version = "0.4.0"
description = "A basic Python-based API client library for registrar.nu.edu.kz"
license = "GPL-3.0-only"
authors = ["aldan <gitaldan@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/aldan/nuregi"
repository = "https://github.com/aldan/nuregi"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
pandas = "^2.1.3"
pydantic = "^2.8.2"
xlrd = "^2.0.1"
pdfplumber = "^0.11.3"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"
ruff = "^0.5.5"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/aldan/nuregi/issues"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "ALL"
]

ignore = [
#   Modules
    "ERA",
    "FBT",
    "CPY"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"nuregi/parsers/common.py" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
